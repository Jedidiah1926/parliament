<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hemicycle — Challenge</title>
  <script src="js/thememode.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/savefile.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fonts/neodgm/style.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/modern.css">
</head>

<body>
  <!-- 챌린지 제작 · 공유 — 목표 · 실패 조건이 있는 짧은 도전. "시험 플레이"로 게임(main.html)에서 바로 해 볼 수 있다 (js/challenge.js) -->
  <div class="scn-frame">
    <header class="scn-head">
      <a class="scn-back" href="maker.html">← 제작물 목록</a>
      <div class="scn-head-title">CHALLENGE EDITOR <span class="scn-test">TEST</span></div>
      <span class="scn-grow"></span>
      <select id="scnLibrary" class="scn-in" title="내 챌린지"></select>
      <button type="button" class="scn-btn" id="scnNew">새 챌린지</button>
      <button type="button" class="scn-btn" id="scnOpen">불러오기</button>
      <button type="button" class="scn-btn" id="scnExport">내보내기 (.hemichl)</button>
      <button type="button" class="scn-btn scn-primary" id="scnPlay">▶ 시험 플레이</button>
      <input type="file" id="scnFile" accept=".hemichl,.hemiscn,.json,application/json" hidden>
    </header>
    <main class="scn-body" id="scnBody"></main>
  </div>

  <script src="js/presets.js"></script>
  <script src="js/challenge-data.js"></script>
  <script src="js/challenge-editor.js"></script>
  <script src="js/lang.js"></script>
</body>
</html>
