<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATANET ORDER — SETTINGS</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">

    <link rel="stylesheet" href="main.css">

    <script src="lang.js"></script>
    <script src="uimode.js"></script>
    <script src="theme.js"></script>
</head>
<body>

    <div class="terminal-container">
        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <div class="header-strip">
            SETTINGS
        </div>

        <div class="content">
            <div class="status-line">
                SYSTEM: ONLINE<br>
                LANGUAGE MODULE
            </div>

            <div>
                <div class="settings-label">LANGUAGE / 언어</div>
                <div class="lang-select-group">
                    <button class="lang-select-btn" id="langBtnKr" onclick="selectLang('kr')">한국어</button>
                    <button class="lang-select-btn" id="langBtnEn" onclick="selectLang('en')">English</button>
                    <button class="lang-select-btn" id="langBtnLocked" disabled title="Coming soon">🔒︎</button>
                </div>
            </div>

            <div>
                <div class="settings-label">UI MODE / 화면 모드</div>
                <div class="lang-select-group">
                    <button class="lang-select-btn" id="uiModeBtnDesktop" onclick="selectUiMode('desktop')">데스크톱<br>(가로형)</button>
                    <button class="lang-select-btn" id="uiModeBtnMobile" onclick="selectUiMode('mobile')">모바일<br>(세로형)</button>
                </div>
            </div>

            <div>
                <div class="settings-label">THEME COLOR / 테마 색</div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <input type="color" id="themeColorInput" onchange="onThemeColorChange(this.value)"
                        style="width:52px;height:40px;padding:0;border:2px solid var(--tno-border);background:none;cursor:pointer;">
                    <input type="text" id="themeColorHexInput" maxlength="7" placeholder="#00ffff"
                        onchange="onThemeColorHexChange(this.value)"
                        style="width:90px;background:#000;border:1px solid var(--tno-border);color:var(--tno-neon);font-family:inherit;font-size:0.9rem;padding:8px 6px;text-align:center;text-transform:uppercase;">
                    <button class="lang-select-btn" onclick="onThemeColorReset()" style="padding:8px 12px;">기본값<br>으로 초기화</button>
                </div>
                <div style="color:var(--tno-text);font-size:0.85rem;margin-top:6px;">모든 화면의 강조 색(테두리·글자 등)에 적용됩니다</div>
            </div>

            <a href="main.html" class="menu-btn" style="text-align:center;">&lt;&lt; BACK</a>

            <div class="footer">
                &copy; 2025-2026 Absatzmarke / Abwehr
            </div>
        </div>
    </div>

    <script>
        function selectLang(lang) {
            setLang(lang);
            renderLangButtons();
        }
        function renderLangButtons() {
            const cur = getLang();
            document.getElementById('langBtnKr').classList.toggle('active', cur === 'kr');
            document.getElementById('langBtnEn').classList.toggle('active', cur === 'en');
        }
        renderLangButtons();

        function selectUiMode(mode) {
            setUiMode(mode);
            renderUiModeButtons();
        }
        function renderUiModeButtons() {
            const cur = getUiMode();
            document.getElementById('uiModeBtnDesktop').classList.toggle('active', cur === 'desktop');
            document.getElementById('uiModeBtnMobile').classList.toggle('active', cur === 'mobile');
        }
        renderUiModeButtons();

        function renderThemeColorInputs() {
            const cur = getThemeColor();
            document.getElementById('themeColorInput').value = cur;
            document.getElementById('themeColorHexInput').value = cur.toUpperCase();
        }
        function onThemeColorChange(hex) {
            setThemeColor(hex);
            renderThemeColorInputs();
        }
        function onThemeColorHexChange(hex) {
            const v = hex.trim().startsWith('#') ? hex.trim() : '#' + hex.trim();
            if (!isValidHexColor(v)) { renderThemeColorInputs(); return; } // 잘못된 값이면 원래 값으로 되돌림
            setThemeColor(v);
            renderThemeColorInputs();
        }
        function onThemeColorReset() {
            resetThemeColor();
            renderThemeColorInputs();
        }
        renderThemeColorInputs();
    </script>

</body>
</html>
