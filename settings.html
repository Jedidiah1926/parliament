<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemicycle — Settings</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/neodgm/style.css">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/modern.css">

    <script src="js/lang.js"></script>
    <script src="js/uimode.js"></script>
    <script src="js/thememode.js"></script>
    <script src="js/dialogs.js"></script>
    <script src="js/theme.js"></script>
</head>
<body class="settings-page">

    <div class="terminal-container settings-shell">
        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <div class="header-strip">
            SETTINGS
        </div>

        <!-- 두 단 설정 화면: 왼쪽 분류 목록 · 오른쪽 그 분류의 설정 -->
        <div class="settings-layout">
            <nav class="settings-nav" aria-label="설정 분류">
                <div class="status-line neon-only">
                    SYSTEM: ONLINE<br>
                    CONFIG MODULE
                </div>
                <button class="settings-nav-item" data-section="display" onclick="showSettingsSection('display')"><span class="settings-nav-icon">🖥</span>화면</button>
                <button class="settings-nav-item" data-section="theme" onclick="showSettingsSection('theme')"><span class="settings-nav-icon">🎨</span>테마</button>
                <div class="settings-nav-spacer"></div>
                <a href="main.html" class="settings-nav-item settings-nav-back">← 메인으로</a>
            </nav>

            <main class="settings-panel">
                <!-- 화면 -->
                <section class="settings-section" id="settingsSectionDisplay" data-section="display">
                    <h2 class="settings-section-title">화면</h2>
                    <div class="settings-section-desc">기기에 맞는 화면 배치를 고릅니다.</div>
                    <div class="settings-group">
                        <div class="settings-label">UI MODE / 화면 모드</div>
                        <div class="lang-select-group">
                            <button class="lang-select-btn" id="uiModeBtnDesktop" onclick="selectUiMode('desktop')">데스크톱 (가로형)</button>
                            <button class="lang-select-btn" id="uiModeBtnMobile" onclick="selectUiMode('mobile')">모바일 (세로형)</button>
                        </div>
                    </div>
                </section>

                <!-- 테마 -->
                <section class="settings-section" id="settingsSectionTheme" data-section="theme">
                    <h2 class="settings-section-title">테마</h2>
                    <div class="settings-section-desc">라이트/다크는 CRT 효과 없는 깔끔한 화면, 네온은 기존의 레트로 터미널 화면입니다.</div>
                    <div class="settings-group">
                        <div class="settings-label">THEME MODE / 테마 모드</div>
                        <div class="lang-select-group">
                            <button class="lang-select-btn" id="themeModeBtnLight" onclick="selectThemeMode('light')">라이트 모드</button>
                            <button class="lang-select-btn" id="themeModeBtnDark" onclick="selectThemeMode('dark')">다크 모드</button>
                            <button class="lang-select-btn" id="themeModeBtnTno" onclick="selectThemeMode('tno')">네온 모드</button>
                        </div>
                    </div>
                    <div class="settings-group" id="themeColorSection">
                        <div class="settings-label">THEME COLOR / 테마 색 <span id="themeColorTnoOnlyNote" style="color:#666;font-size:0.75rem;text-transform:none;"></span></div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <input type="color" id="themeColorInput" onchange="onThemeColorChange(this.value)"
                                style="width:52px;height:40px;padding:0;border:2px solid var(--tno-border);background:none;cursor:pointer;">
                            <input type="text" id="themeColorHexInput" maxlength="7" placeholder="#00ffff"
                                onchange="onThemeColorHexChange(this.value)"
                                style="width:90px;background:#000;border:1px solid var(--tno-border);color:var(--tno-neon);font-family:inherit;font-size:0.9rem;padding:8px 6px;text-align:center;text-transform:uppercase;">
                            <button class="lang-select-btn" id="themeColorResetBtn" onclick="onThemeColorReset()" style="padding:8px 12px;">기본값으로 초기화</button>
                        </div>
                        <div class="settings-hint">네온 모드의 강조 색(테두리·글자 등)에 적용됩니다</div>
                    </div>
                </section>
            </main>
        </div>

        <!-- 저작권 표시: 화면 맨 아래 -->
        <div class="footer settings-footer">
            &copy; 2025-2026 Pilcrow1926
        </div>
    </div>

    <script>
        // ===== 분류 전환 — 선택한 분류는 주소(#display 등)에 남겨 새로고침해도 그대로 =====
        const SETTINGS_SECTIONS = ['display', 'theme'];
        function showSettingsSection(key) {
            if(!SETTINGS_SECTIONS.includes(key)) key = SETTINGS_SECTIONS[0];
            document.querySelectorAll('.settings-section').forEach(sec => sec.classList.toggle('active', sec.dataset.section === key));
            document.querySelectorAll('.settings-nav-item[data-section]').forEach(b => b.classList.toggle('active', b.dataset.section === key));
            if(location.hash !== '#' + key) history.replaceState(null, '', '#' + key);
            document.querySelector('.settings-panel')?.scrollTo(0, 0);
        }
        showSettingsSection((location.hash || '').slice(1));
        window.addEventListener('hashchange', () => showSettingsSection((location.hash || '').slice(1)));

        function selectUiMode(mode) {
            setUiMode(mode);
            renderUiModeButtons();
        }
        function renderUiModeButtons() {
            const cur = getUiMode();
            document.getElementById('uiModeBtnDesktop').classList.toggle('active', cur === 'desktop');
            document.getElementById('uiModeBtnMobile').classList.toggle('active', cur === 'mobile');
        }
        renderUiModeButtons();

        function selectThemeMode(mode) {
            setThemeMode(mode);
            renderThemeModeButtons();
            renderThemeColorInputs();
        }
        function renderThemeModeButtons() {
            const cur = getThemeMode();
            document.getElementById('themeModeBtnLight').classList.toggle('active', cur === 'light');
            document.getElementById('themeModeBtnDark').classList.toggle('active', cur === 'dark');
            document.getElementById('themeModeBtnTno').classList.toggle('active', cur === 'tno');
        }
        renderThemeModeButtons();

        function renderThemeColorInputs() {
            const cur = getThemeColor();
            const isTno = getThemeMode() === 'tno';
            document.getElementById('themeColorInput').value = cur;
            document.getElementById('themeColorHexInput').value = cur.toUpperCase();
            document.getElementById('themeColorInput').disabled = !isTno;
            document.getElementById('themeColorHexInput').disabled = !isTno;
            document.getElementById('themeColorResetBtn').disabled = !isTno;
            document.getElementById('themeColorSection').style.opacity = isTno ? '1' : '0.4';
            document.getElementById('themeColorTnoOnlyNote').textContent = isTno ? '' : '(네온 모드에서만 변경 가능)';
        }
        function onThemeColorChange(hex) {
            setThemeColor(hex);
            renderThemeColorInputs();
        }
        function onThemeColorHexChange(hex) {
            const v = hex.trim().startsWith('#') ? hex.trim() : '#' + hex.trim();
            if (!isValidHexColor(v)) { renderThemeColorInputs(); return; } // 잘못된 값이면 원래 값으로 되돌림
            setThemeColor(v);
            renderThemeColorInputs();
        }
        function onThemeColorReset() {
            resetThemeColor();
            renderThemeColorInputs();
        }
        renderThemeColorInputs();
    </script>

</body>
</html>
