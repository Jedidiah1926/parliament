    <script>
        // maintenance.js의 시각은 항상 KST(UTC+9) 기준이므로 보는 사람의 시간대와 무관하게 +09:00으로 해석
        function parseMaintTime(v) { return v ? new Date(v + '+09:00') : null; }
        function fmtMaintTime(d) {
            const parts = new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: false
            }).formatToParts(d);
            const get = t => parts.find(p => p.type === t).value;
            return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}`;
        }

        // 아직 시작되지 않은(=예정된) 점검이 있으면 상단에 안내 바를 띄운다
        function checkUpcomingMaintenance() {
            const bar = document.getElementById('maintNoticeBar');
            if(!bar || typeof MAINTENANCE_WINDOW === 'undefined') return;
            const start = parseMaintTime(MAINTENANCE_WINDOW.start);
            const end = parseMaintTime(MAINTENANCE_WINDOW.end);
            if(start && new Date() < start) {
                const text = end
                    ? `예정된 점검: ${fmtMaintTime(start)} ~ ${fmtMaintTime(end)} (KST)`
                    : `예정된 점검: ${fmtMaintTime(start)} (KST)부터`;
                document.getElementById('maintNoticeText').textContent = text;
                bar.style.display = 'block';
            } else {
                bar.style.display = 'none';
            }
        }
        checkUpcomingMaintenance();
        setInterval(checkUpcomingMaintenance, 15000);

        // ===== 세이브 선택 (온보딩) 모달 =====
        // main.html은 dno.js를 로드하지 않으므로, dno.js가 쓰는 것과 같은 localStorage 키를
        // 그대로 읽어서 세이브 목록을 보여준다. 실제 상태(state) 파싱/적용은 하지 않고
        // 목록 표시와 부팅 시 넘길 sessionStorage 플래그 설정만 담당 — 무거운 state 객체를
        // 여기서 손댈 필요가 없다.
        const SAVE_SLOTS_KEY = 'dnoParliamentSaveSlots';
        const LEGACY_AUTOSAVE_KEY = 'dnoParliamentAutosave'; // 세이브 슬롯 통합 이전, 단일 키에 저장하던 구버전 자동저장
        const AUTOSAVE_SLOT_ID = 'autosave';
        const AUTOSAVE_SLOT_NAME = '새 의회 (1)';

        // 구버전 자동저장 데이터가 남아있는데 아직 새 슬롯 배열로 옮겨지지 않았다면
        // (dno.html을 아직 한 번도 다시 열지 않은 사용자) 여기서도 옮겨서 목록에 바로 보이게 함.
        function migrateLegacyAutosaveForMenu() {
            const legacyRaw = localStorage.getItem(LEGACY_AUTOSAVE_KEY);
            if(!legacyRaw) return;
            let slots;
            try { slots = JSON.parse(localStorage.getItem(SAVE_SLOTS_KEY) || '[]'); } catch(e) { slots = []; }
            if(slots.some(s => s.isAutosave && !s.parentId)) { localStorage.removeItem(LEGACY_AUTOSAVE_KEY); return; }
            let legacyState;
            try { legacyState = JSON.parse(legacyRaw); } catch(e) { localStorage.removeItem(LEGACY_AUTOSAVE_KEY); return; }
            slots.unshift({ id: AUTOSAVE_SLOT_ID, name: AUTOSAVE_SLOT_NAME, isAutosave: true,
                savedAt: legacyState?.meta?.savedAt || new Date().toISOString(), state: legacyState });
            localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(slots));
            localStorage.removeItem(LEGACY_AUTOSAVE_KEY);
        }

        function loadSaveSlotsForMenu() {
            migrateLegacyAutosaveForMenu();
            let slots;
            try { slots = JSON.parse(localStorage.getItem(SAVE_SLOTS_KEY) || '[]'); }
            catch(e) { return []; }
            // 기본(전역) 자동저장 슬롯은 항상 현재 이름으로 (예전 이름 "기존 저장"으로 저장된 기록 포함)
            if(Array.isArray(slots)) slots.forEach(s => { if(s && s.isAutosave && !s.parentId) s.name = AUTOSAVE_SLOT_NAME; });
            return slots;
        }

        // 즐겨찾기는 세이브 슬롯 배열과 따로 보관 — dno.js가 슬롯 배열을 통째로 다시 쓰더라도 지워지지 않게
        const SAVE_FAVORITES_KEY = 'dnoSaveFavorites';
        const MAX_SAVE_SLOTS = 20; // dno.js와 동일 (전용 자동저장 슬롯 제외)
        function loadFavorites() {
            try { return new Set(JSON.parse(localStorage.getItem(SAVE_FAVORITES_KEY) || '[]')); } catch(e) { return new Set(); }
        }
        function toggleFavorite(id) {
            const fav = loadFavorites();
            if(fav.has(id)) fav.delete(id); else fav.add(id);
            try { localStorage.setItem(SAVE_FAVORITES_KEY, JSON.stringify(Array.from(fav))); } catch(e) {}
            renderSaveSelectList();
        }

        function renderSaveSelectList() {
            const container = document.getElementById('saveSelectList');
            const all = loadSaveSlotsForMenu();
            const fav = loadFavorites();
            const query = (document.getElementById('saveSearchInput')?.value || '').trim().toLowerCase();
            const byTime = (a, b) => new Date(b.savedAt||0) - new Date(a.savedAt||0);
            const defaultAuto = all.find(s => s.isAutosave && !s.parentId);
            const named = all.filter(s => !s.isAutosave).sort(byTime);
            // 즐겨찾기한 세이브가 맨 위, 그다음 기본 자동저장, 나머지는 최근 저장 순 — 전용 자동저장은 부모 바로 아래
            const tops = [...named.filter(n => fav.has(n.id)), ...(defaultAuto ? [defaultAuto] : []), ...named.filter(n => !fav.has(n.id))];
            if(defaultAuto && fav.has(defaultAuto.id)) { tops.splice(tops.indexOf(defaultAuto), 1); tops.unshift(defaultAuto); }
            const ordered = [];
            tops.forEach(n => {
                ordered.push(n);
                if(!n.isAutosave) {
                    const companion = all.find(s => s.isAutosave && s.parentId === n.id);
                    if(companion) ordered.push(companion);
                }
            });
            const matches = s => !query || String(s.name || '').toLowerCase().includes(query);
            const shown = ordered.filter(matches);
            if(all.length === 0) {
                container.innerHTML = '<div class="save-select-empty">저장된 세이브가 없습니다. 왼쪽에서 새로 시작하세요.</div>';
                return;
            }
            if(shown.length === 0) {
                container.innerHTML = '<div class="save-select-empty">검색 결과가 없습니다.</div>';
                return;
            }
            container.innerHTML = shown.map(s => {
                const isFav = fav.has(s.id);
                const isCompanion = s.isAutosave && s.parentId;
                return `
                <div class="save-select-row${isCompanion ? ' save-select-row-companion' : ''}">
                    ${isCompanion ? '' : `<button class="save-fav-btn${isFav ? ' on' : ''}" onclick="toggleFavorite('${s.id}')" title="${isFav ? '즐겨찾기 해제' : '즐겨찾기'}" aria-pressed="${isFav}">${isFav ? '★' : '☆'}</button>`}
                    <button class="save-select-item${s.isAutosave ? ' save-select-item-auto' : ''}" onclick="continueSave('${s.id}')">
                        <span class="save-select-item-name">${s.isAutosave ? '🔄 ' : ''}${escapeSaveName(s.name)}</span>
                        <span class="save-select-item-time">${s.savedAt ? new Date(s.savedAt).toLocaleString('ko-KR') : '-'}</span>
                    </button>
                    <button class="save-del-btn" onclick="deleteSaveFromMenu(event, '${s.id}')" title="삭제 (Shift+클릭: 확인 없이 바로 삭제)" aria-label="삭제">${TRASH_ICON}</button>
                </div>`;
            }).join('');
        }

        // ===== 세이브 삭제 (휴지통) — 그냥 클릭은 확인창, Shift+클릭은 바로 삭제 =====
        // 이름 붙은 세이브를 지우면 그 세이브 전용 자동저장도 함께 지워진다. 자동저장만 지우면 그 자동저장만 사라진다.
        const TRASH_ICON = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5.5 5.5l.7 10.6a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9l.7-10.6M8.5 8.5v5.5M11.5 8.5v5.5"/></svg>';
        async function deleteSaveFromMenu(e, id) {
            e.stopPropagation();
            const all = loadSaveSlotsForMenu();
            const slot = all.find(s => s.id === id);
            if(!slot) return;
            const isNamed = !slot.isAutosave;
            if(!e.shiftKey) {
                const extra = isNamed && all.some(s => s.parentId === id) ? `\n연결된 "${slot.name} 자동저장"도 함께 삭제됩니다.` : '';
                const ok = await DnoUI.confirm(`"${slot.name}"을(를) 정말 삭제하시겠습니까?${extra}\n\n삭제하면 되돌릴 수 없습니다. (Shift+클릭하면 이 확인 없이 바로 삭제)`, { title: '세이브 삭제', tone: 'danger', okText: '삭제', focusCancel: true });
                if(!ok) return;
            }
            const rest = loadSaveSlotsForMenu().filter(s => s.id !== id && !(isNamed && s.parentId === id));
            try { localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(rest)); }
            catch(err) { DnoUI.alert('삭제하지 못했습니다. (저장 공간 오류)'); return; }
            const fav = loadFavorites();
            if(fav.delete(id)) { try { localStorage.setItem(SAVE_FAVORITES_KEY, JSON.stringify(Array.from(fav))); } catch(err) {} }
            // 이어서 하던 세이브였다면 "지금 세이브" 표시도 정리 (다음에 열면 기본 세션으로)
            if(isNamed) { try { if(localStorage.getItem('dnoParliamentActiveSlotId') === id) localStorage.removeItem('dnoParliamentActiveSlotId'); } catch(err) {} }
            renderSaveSelectList();
        }

        async function renderPresetSelectList() {
            const container = document.getElementById('presetSelectList');
            container.innerHTML = '<div class="save-select-empty">불러오는 중...</div>';
            const list = window.DnoPresets ? await DnoPresets.list() : [];
            if(list.length === 0) {
                container.innerHTML = '<div class="save-select-empty">등록된 프리셋이 없습니다.</div>';
                return;
            }
            container.innerHTML = list.map((p, i) => `
                <button class="save-select-item preset-card${p.tutorial ? ' preset-card-tutorial' : ''}" onclick="startFromPreset(${i})">
                    <span class="preset-card-top">
                        <span class="save-select-item-name">${escapeSaveName(p.title)}</span>
                        ${p.tutorial ? '<span class="preset-badge">튜토리얼</span>' : ''}
                    </span>
                    ${p.description ? `<span class="preset-card-desc">${escapeSaveName(p.description)}</span>` : ''}
                </button>`).join('');
            container.dataset.count = String(list.length);
        }

        function escapeSaveName(name) {
            const div = document.createElement('div');
            div.textContent = name == null ? '' : String(name);
            return div.innerHTML;
        }

        function openSaveSelectModal() {
            document.getElementById('newSaveNameInput').value = '';
            document.getElementById('saveSearchInput').value = '';
            renderSaveSelectList();
            renderPresetSelectList();
            document.getElementById('saveSelectOverlay').style.display = 'flex';
        }

        function closeSaveSelectModal() {
            document.getElementById('saveSelectOverlay').style.display = 'none';
        }

        function namedSlotCount() { return loadSaveSlotsForMenu().filter(s => !s.isAutosave).length; }

        function startNewSave() {
            const input = document.getElementById('newSaveNameInput');
            const name = input.value.trim();
            if(!name) { alert('세이브 이름을 입력하세요.'); return; }
            if(name === AUTOSAVE_SLOT_NAME) { alert(`"${AUTOSAVE_SLOT_NAME}"은(는) 예약된 이름입니다. 다른 이름을 입력하세요.`); return; }
            if(loadSaveSlotsForMenu().some(s => !s.isAutosave && s.name === name)) {
                alert(`"${name}" 세이브가 이미 있습니다. 다른 이름을 입력하세요.`);
                return;
            }
            if(namedSlotCount() >= MAX_SAVE_SLOTS) { alert(`저장 슬롯은 최대 ${MAX_SAVE_SLOTS}개까지 만들 수 있습니다. 기존 세이브를 삭제한 뒤 다시 시도하세요.`); return; }
            try { sessionStorage.setItem('dnoBootNewSaveName', name); } catch(e) {}
            location.href = 'dno.html';
        }

        // 프리셋을 고르면 그 상태의 복사본을 새 세이브(프리셋 제목, 겹치면 번호 붙임)로 만들어 바로 시작 —
        // 실제 복제는 dno.html이 프리셋을 불러온 뒤에 한다
        async function startFromPreset(index) {
            const list = window.DnoPresets ? await DnoPresets.list() : [];
            const preset = list[index];
            if(!preset) return;
            if(namedSlotCount() >= MAX_SAVE_SLOTS) { alert(`저장 슬롯은 최대 ${MAX_SAVE_SLOTS}개까지 만들 수 있습니다. 기존 세이브를 삭제한 뒤 다시 시도하세요.`); return; }
            try {
                sessionStorage.setItem('dnoBootPresetId', preset.id);
                sessionStorage.setItem('dnoBootNewSaveName', window.DnoLang ? DnoLang.t(preset.title) : preset.title); // 영어 등에서는 세이브 이름도 번역
            } catch(e) {}
            location.href = 'dno.html';
        }

        function continueSave(id) {
            try { sessionStorage.setItem('dnoBootLoadSlotId', id); } catch(e) {}
            location.href = 'dno.html';
        }

        // 로컬 세이브 슬롯이 아니라, 예전에 "파일로 저장"으로 다운로드해둔 .json 파일을
        // 그대로 불러와 이어서 시작 — localStorage 세이브 목록에는 등록되지 않고,
        // 이후 자동저장은 기본 "새 의회 (1)" 슬롯을 계속 덮어씀.
        async function importSaveFile(input) {
            const file = input.files?.[0];
            if(!file) return;
            try {
                const text = await file.text();
                const obj = JSON.parse(text);
                const parl = obj.parliament || obj.data;
                if(!parl || !Array.isArray(parl.parties)) throw new Error('형식이 올바르지 않음');
                sessionStorage.setItem('dnoBootImportedStateJSON', text);
            } catch(e) {
                alert('저장 파일을 불러올 수 없습니다. (형식이 올바르지 않거나 손상된 파일)');
                input.value = '';
                return;
            }
            location.href = 'dno.html';
        }

        document.getElementById('saveSelectOverlay').addEventListener('click', (e) => {
            if(e.target.id === 'saveSelectOverlay') closeSaveSelectModal();
        });
        window.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && document.getElementById('saveSelectOverlay').style.display !== 'none') closeSaveSelectModal();
        });

        // 언어가 한국어가 아니면, 세이브 창의 목록처럼 페이지를 연 뒤에 새로 그려지는 부분도 번역한다 (js/lang.js)
        const translateSaveWindow = () => { if(window.DnoLang && window.DnoLang.translateSubtree) window.DnoLang.translateSubtree(document.getElementById('saveSelectOverlay')); };
        const _renderSaveSelectList = renderSaveSelectList;
        renderSaveSelectList = function() { const r = _renderSaveSelectList.apply(this, arguments); translateSaveWindow(); return r; };
        const _renderPresetSelectList = renderPresetSelectList;
        renderPresetSelectList = async function() { const r = await _renderPresetSelectList.apply(this, arguments); translateSaveWindow(); return r; };
    </script>

    <script>
        // ===== 메인 화면 언어 바로 바꾸기 (고르면 이 화면을 다시 불러와 적용 · 언어 팩 불러오기/템플릿/삭제도 여기서) =====
        function renderHomeLangMenu() {
            const menu = document.getElementById('homeLangMenu');
            const codeEl = document.getElementById('homeLangCode');
            if(!menu || !window.DnoLang) return;
            const cur = getLang();
            const list = DnoLang.list();
            const curItem = list.find(l => l.code === cur);
            if(codeEl) codeEl.textContent = (cur === 'kr' ? 'KO' : cur.toUpperCase());
            menu.innerHTML = list.map(l => `
                <button type="button" class="home-lang-item${l.code === cur ? ' active' : ''}" role="menuitemradio" aria-checked="${l.code === cur}" onclick="pickHomeLang('${l.code}')">
                    <span>${l.name.replace(/[<>&]/g, '')}</span>${l.code === cur ? '<span class="home-lang-check">✓</span>' : ''}${l.installed ? `<span class="home-lang-remove" role="button" title="언어 팩 삭제" onclick="removeHomeLangPack(event, '${l.code}')">✕</span>` : ''}
                </button>`).join('') + `
                <div class="home-lang-tools">
                    <button type="button" class="home-lang-more" onclick="document.getElementById('langPackFileInput').click()">언어 팩 불러오기 (.json)</button>
                    <button type="button" class="home-lang-more" onclick="downloadLangTemplate()">번역 템플릿 받기</button>
                </div>`;
        }
        // 불러온 언어 팩 삭제 — 쓰던 언어였다면 한국어로 돌아가 다시 불러옴
        async function removeHomeLangPack(e, code) {
            e.stopPropagation();
            const item = DnoLang.list().find(l => l.code === code);
            if(!item || !(await DnoUI.confirm(`"${item.name}" 언어 팩을 삭제할까요?`, { tone: 'danger', okText: '삭제' }))) return;
            const wasCurrent = getLang() === code;
            DnoLang.remove(code);
            if(wasCurrent) { location.reload(); return; }
            renderHomeLangMenu();
        }
        async function importLangPack(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if(!file) return;
            let raw;
            try { raw = JSON.parse(await file.text()); }
            catch(e) { alert('언어 팩을 읽을 수 없습니다. (올바른 JSON 파일이 아닙니다)'); return; }
            const result = DnoLang.install(raw);
            if(!result.ok) { alert('언어 팩을 불러오지 못했습니다: ' + result.error); return; }
            renderHomeLangMenu();
            if(await DnoUI.confirm(`"${result.name}" 언어 팩을 불러왔습니다. 지금 이 언어로 바꿀까요?`)) { setLang(result.code); location.reload(); }
        }
        async function downloadLangTemplate() {
            try {
                const text = await DnoLang.template();
                const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dno-lang-template.json';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            } catch(e) { alert('번역 템플릿을 만들지 못했습니다.'); }
        }
        function toggleHomeLangMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('homeLangMenu');
            const open = menu.style.display === 'none';
            if(open) renderHomeLangMenu();
            menu.style.display = open ? '' : 'none';
            document.getElementById('homeLangBtn').setAttribute('aria-expanded', String(open));
        }
        function pickHomeLang(code) {
            if(code !== getLang()) { setLang(code); location.reload(); return; }
            document.getElementById('homeLangMenu').style.display = 'none';
        }
        document.addEventListener('click', e => {
            const menu = document.getElementById('homeLangMenu');
            if(menu && menu.style.display !== 'none' && !menu.contains(e.target)) {
                menu.style.display = 'none';
                document.getElementById('homeLangBtn')?.setAttribute('aria-expanded', 'false');
            }
        });
        document.addEventListener('keydown', e => { if(e.key === 'Escape') { const m = document.getElementById('homeLangMenu'); if(m) m.style.display = 'none'; } });
        renderHomeLangMenu();
    </script>
</body>
