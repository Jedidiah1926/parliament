        <div class="save-select-modal">
            <div class="corner top-left"></div>
            <div class="corner bottom-right"></div>
            <div class="save-select-head">
                <span>SAVE SELECT</span>

            </div>
            <div class="save-select-body">
                <div class="settings-label">새 세이브 만들기</div>
                <div class="save-select-new-row">
                    <input type="text" id="newSaveNameInput" placeholder="예: 2차 총선 직후" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();startNewSave();}">
                    <button class="menu-btn save-select-start-btn" onclick="startNewSave()">생성 후 시작</button>
                </div>

                <div class="settings-label" style="margin-top:22px;">이어하기</div>

                <input type="file" id="saveFileInput" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="importSaveFile(this)">
                <button class="save-select-item save-select-import-btn" onclick="document.getElementById('saveFileInput').click()">

    <script>
        // maintenance.js의 시각은 항상 KST(UTC+9) 기준이므로 보는 사람의 시간대와 무관하게 +09:00으로 해석
        function parseMaintTime(v) { return v ? new Date(v + '+09:00') : null; }
        function fmtMaintTime(d) {
            const parts = new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: false
            }).formatToParts(d);
            const get = t => parts.find(p => p.type === t).value;
            return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}`;
        }

        // 아직 시작되지 않은(=예정된) 점검이 있으면 상단에 안내 바를 띄운다
        function checkUpcomingMaintenance() {
            const bar = document.getElementById('maintNoticeBar');
            if(!bar || typeof MAINTENANCE_WINDOW === 'undefined') return;
            const start = parseMaintTime(MAINTENANCE_WINDOW.start);
            const end = parseMaintTime(MAINTENANCE_WINDOW.end);
            if(start && new Date() < start) {
                const text = end
                    ? `예정된 점검: ${fmtMaintTime(start)} ~ ${fmtMaintTime(end)} (KST)`
                    : `예정된 점검: ${fmtMaintTime(start)} (KST)부터`;
                document.getElementById('maintNoticeText').textContent = text;
                bar.style.display = 'block';
            } else {
                bar.style.display = 'none';
            }
        }
        checkUpcomingMaintenance();
        setInterval(checkUpcomingMaintenance, 15000);

        // ===== 세이브 선택 (온보딩) 모달 =====
        // main.html은 dno.js를 로드하지 않으므로, dno.js가 쓰는 것과 같은 localStorage 키를
        // 그대로 읽어서 세이브 목록을 보여준다. 실제 상태(state) 파싱/적용은 하지 않고
        // 목록 표시와 부팅 시 넘길 sessionStorage 플래그 설정만 담당 — 무거운 state 객체를
        // 여기서 손댈 필요가 없다.
        const SAVE_SLOTS_KEY = 'dnoParliamentSaveSlots';
        const LEGACY_AUTOSAVE_KEY = 'dnoParliamentAutosave'; // 세이브 슬롯 통합 이전, 단일 키에 저장하던 구버전 자동저장
        const AUTOSAVE_SLOT_ID = 'autosave';
        const AUTOSAVE_SLOT_NAME = '기존 저장';

        // 구버전 자동저장 데이터가 남아있는데 아직 새 슬롯 배열로 옮겨지지 않았다면
        // (dno.html을 아직 한 번도 다시 열지 않은 사용자) 여기서도 옮겨서 목록에 바로 보이게 함.
        function migrateLegacyAutosaveForMenu() {
            const legacyRaw = localStorage.getItem(LEGACY_AUTOSAVE_KEY);
            if(!legacyRaw) return;
            let slots;
            try { slots = JSON.parse(localStorage.getItem(SAVE_SLOTS_KEY) || '[]'); } catch(e) { slots = []; }
            if(slots.some(s => s.isAutosave && !s.parentId)) { localStorage.removeItem(LEGACY_AUTOSAVE_KEY); return; }
            let legacyState;
            try { legacyState = JSON.parse(legacyRaw); } catch(e) { localStorage.removeItem(LEGACY_AUTOSAVE_KEY); return; }
            slots.unshift({ id: AUTOSAVE_SLOT_ID, name: AUTOSAVE_SLOT_NAME, isAutosave: true,
                savedAt: legacyState?.meta?.savedAt || new Date().toISOString(), state: legacyState });
            localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(slots));
            localStorage.removeItem(LEGACY_AUTOSAVE_KEY);
        }

        function loadSaveSlotsForMenu() {
            migrateLegacyAutosaveForMenu();
            try { return JSON.parse(localStorage.getItem(SAVE_SLOTS_KEY) || '[]'); }
            catch(e) { return []; }
        }

        function renderSaveSelectList() {
            const container = document.getElementById('saveSelectList');
            const all = loadSaveSlotsForMenu();
            const defaultAuto = all.find(s => s.isAutosave && !s.parentId);
            const named = all.filter(s => !s.isAutosave).sort((a,b) => new Date(b.savedAt||0) - new Date(a.savedAt||0));
            const ordered = [];
            if(defaultAuto) ordered.push(defaultAuto);
            named.forEach(n => {
                ordered.push(n);
                const companion = all.find(s => s.isAutosave && s.parentId === n.id);
                if(companion) ordered.push(companion);
            });
            if(ordered.length === 0) {
                container.innerHTML = '<div style="color:#444;font-size:0.85rem;padding:8px 0;">저장된 세이브가 없습니다. 새 세이브를 만들어 시작하세요.</div>';
                return;
            }
            container.innerHTML = ordered.map(s => `
                <button class="save-select-item${s.isAutosave ? ' save-select-item-auto' : ''}" onclick="continueSave('${s.id}')">
                    <span class="save-select-item-name">${s.isAutosave ? '🔄 ' : ''}${escapeSaveName(s.name)}</span>
                    <span class="save-select-item-time">${s.savedAt ? new Date(s.savedAt).toLocaleString('ko-KR') : '-'}</span>
                </button>
            `).join('');
        }

        function escapeSaveName(name) {
            const div = document.createElement('div');
            div.textContent = name;
            return div.innerHTML;
        }

        function openSaveSelectModal() {
            document.getElementById('newSaveNameInput').value = '';
            renderSaveSelectList();
            document.getElementById('saveSelectOverlay').style.display = 'flex';
        }

        function closeSaveSelectModal() {
            document.getElementById('saveSelectOverlay').style.display = 'none';
        }

        function startNewSave() {
            const input = document.getElementById('newSaveNameInput');
            const name = input.value.trim();
            if(!name) { alert('세이브 이름을 입력하세요.'); return; }
            if(name === AUTOSAVE_SLOT_NAME) { alert(`"${AUTOSAVE_SLOT_NAME}"은(는) 예약된 이름입니다. 다른 이름을 입력하세요.`); return; }
            if(loadSaveSlotsForMenu().some(s => !s.isAutosave && s.name === name)) {
                alert(`"${name}" 세이브가 이미 있습니다. 다른 이름을 입력하세요.`);
                return;
            }
            try { sessionStorage.setItem('dnoBootNewSaveName', name); } catch(e) {}
            location.href = 'dno.html';
        }

        function continueSave(id) {
            try { sessionStorage.setItem('dnoBootLoadSlotId', id); } catch(e) {}
            location.href = 'dno.html';
        }

        // 로컬 세이브 슬롯이 아니라, 예전에 "파일로 저장"으로 다운로드해둔 .json 파일을
        // 그대로 불러와 이어서 시작 — localStorage 세이브 목록에는 등록되지 않고,
        // 이후 자동저장은 기본 "기존 저장" 슬롯을 계속 덮어씀.
        async function importSaveFile(input) {
            const file = input.files?.[0];
            if(!file) return;
            try {
                const text = await file.text();
                const obj = JSON.parse(text);
                const parl = obj.parliament || obj.data;
                if(!parl || !Array.isArray(parl.parties)) throw new Error('형식이 올바르지 않음');
                sessionStorage.setItem('dnoBootImportedStateJSON', text);
            } catch(e) {
                alert('저장 파일을 불러올 수 없습니다. (형식이 올바르지 않거나 손상된 파일)');
                input.value = '';
                return;
            }
            location.href = 'dno.html';
        }

        document.getElementById('saveSelectOverlay').addEventListener('click', (e) => {
            if(e.target.id === 'saveSelectOverlay') closeSaveSelectModal();
        });
        window.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && document.getElementById('saveSelectOverlay').style.display !== 'none') closeSaveSelectModal();
        });
    </script>
