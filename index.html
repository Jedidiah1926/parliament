<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATANET ORDER — SYSTEM MAINTENANCE</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">

    <link rel="stylesheet" href="index.css">

    <!-- ── 점검 스위치 ──────────────────────────────────
         maintenance.js 의 시작/종료 시각을 기준으로 자동 판정합니다.
         그 사이 시간이면 점검중 페이지, 아니면 REDIRECT_URL 로 즉시 이동.
    ─────────────────────────────────────────────────── -->
    <script src="maintenance.js"></script>
    <script>
        const REDIRECT_URL = "dno.main.html";
        function parseMaintTime(v) { return v ? new Date(v) : null; }
        const MAINT_START = parseMaintTime(MAINTENANCE_WINDOW.start);
        const MAINT_END   = parseMaintTime(MAINTENANCE_WINDOW.end);
        function isMaintenanceNow() {
            const now = new Date();
            return (!MAINT_START || now >= MAINT_START) && (!MAINT_END || now < MAINT_END);
        }
        const MAINTENANCE_MODE = isMaintenanceNow();
        if (!MAINTENANCE_MODE) {
            document.write('<meta http-equiv="refresh" content="0; url=' + REDIRECT_URL + '">');
        }
    </script>
</head>
<body>

    <div class="terminal-container" id="maintenanceView">
        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <div class="header-strip">
            SYSTEM MAINTENANCE
        </div>

        <div class="content">
            <div class="status-line">
                SYSTEM: OFFLINE<br>
                SCHEDULED MAINTENANCE IN PROGRESS<br>
                <span class="alert-text">ACCESS TEMPORARILY RESTRICTED</span>
            </div>

            <div class="maintenance-box">
                <div class="maintenance-icon">⚠</div>
                <div class="maintenance-title">// 점검중 // UNDER MAINTENANCE</div>
                <div class="maintenance-msg">
                    현재 시스템 점검이 진행 중입니다.<br>
                    보다 안정적인 서비스 제공을 위해 노력하고 있습니다.<br>
                    이용에 불편을 드려 죄송합니다.
                </div>
                <div class="maintenance-period" id="maintenancePeriod"></div>
                <div class="maintenance-eta">— 점검이 완료되는 대로 서비스가 재개됩니다.</div>
            </div>

            <div class="footer">
                &copy; 2025-2026 Absatzmarke / Abwehr
            </div>
        </div>
    </div>

    <p id="redirectView" style="display:none; font-family:'NeoDunggeunmo','VT323',monospace; color:#e0e0e0; text-align:center;">
        페이지를 이동 중입니다. 잠시만 기다려주세요.
        <a id="redirectLink" href="#" style="color:#00ffff;">직접 이동하기</a>
    </p>

    <script>
        function fmtMaintTime(d) {
            if (!d) return '미정';
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }
        document.getElementById('maintenancePeriod').textContent =
            `점검 기간: ${fmtMaintTime(MAINT_START)} ~ ${fmtMaintTime(MAINT_END)}`;

        if (!MAINTENANCE_MODE) {
            document.getElementById('maintenanceView').style.display = 'none';
            document.getElementById('redirectView').style.display = 'block';
            document.getElementById('redirectLink').href = REDIRECT_URL;
            window.location.replace(REDIRECT_URL);
        } else if (MAINT_END) {
            // 종료 시각이 지나면 새로고침 없이도 자동으로 이동
            setInterval(() => {
                if (!isMaintenanceNow()) window.location.replace(REDIRECT_URL);
            }, 15000);
        }
    </script>

</body>
</html>
