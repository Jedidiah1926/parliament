# Windows 데스크톱 앱 빌드 → GitHub Release에 올리기
# v로 시작하는 태그(예: v1.5.7-obt)를 올리면 Windows 서버에서 설치 프로그램(.exe)과 포터블(.zip)을 만들어
# 같은 이름의 Release를 만들고 파일을 붙인다. 태그에 -obt / -beta 등이 붙으면 "사전 출시(pre-release)"로 표시.
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer and portable zip
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hemicycle ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/release-notes.md
          files: |
            dist/*.exe
            dist/*.zip
