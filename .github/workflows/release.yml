# Windows 데스크톱 앱 빌드 → GitHub Release에 올리기
# v로 시작하는 태그(예: v1.6.5-obt)를 올리거나, Actions 탭에서 "Run workflow"로 태그 이름을 넣고 실행하면
# Windows 서버에서 설치 프로그램(.exe)과 포터블(.zip)을 만들어 그 태그의 Release를 만들고 파일을 붙인다
# (수동 실행이면 태그도 새로 만든다). 태그에 -obt / -beta 등이 붙으면 "사전 출시(pre-release)"로 표시.
# 업데이트 정보(latest.yml)와 차분 파일(.blockmap)도 함께 올려, 설치판 앱이 새 Release를 찾아 자동으로 받아 설치한다 (electron/updater.js).
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 태그 이름 (예: v1.6.5-obt)'
        required: true
        default: 'v1.6.5-obt'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 앱 버전 = 태그 (v1.6.1-obt → 1.6.1-obt) — 앱의 자동 업데이트가 이 버전과 Release 태그를 견줘 새 버전을 찾는다
      - name: Set app version from tag
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build installer and portable zip
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Hemicycle ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          body_path: .github/release-notes.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
