<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Development Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">

    <link rel="stylesheet" href="dno.roadmap.css">
</head>

<body>
  <div class="rd-frame" aria-label="Development Roadmap">
    <div class="rd-header">
      <div class="rd-header-title">DEVELOPMENT ROADMAP</div>
      <div class="rd-header-divider"></div>
      <nav class="rd-version-nav" aria-label="Roadmap Version Selector">
        <button class="rd-version-btn" data-version="0.0" type="button">0.0</button>
        <button class="rd-version-btn" data-version="0.1" type="button">0.1</button>
        <button class="rd-version-btn" data-version="0.2" type="button">0.2</button>
        <button class="rd-version-btn" data-version="1.0" type="button">1.0</button>
        <button class="rd-version-btn" data-version="1.1" type="button">1.1</button>
        <button class="rd-version-btn" data-version="1.2" type="button">1.2</button>
        <button class="rd-version-btn" data-version="1.3" type="button">1.3</button>
        <button class="rd-version-btn active" data-version="1.4" type="button">1.4</button>
        <button class="rd-version-btn" data-version="1.5" type="button">1.5</button>
      </nav>
    </div>

    <div class="rd-content">
      <h1 class="rd-version" id="roadmapVersionTitle">1.4 : The Great Reform</h1>

      <div class="rd-track-viewport" id="roadmapViewport">
        <div class="rd-track-inner" id="roadmapTrack">
          <div class="rd-track-line" id="roadmapLine"></div>
        </div>
      </div>
    </div>
  </div>

    <script src="dno.roadmap.js"></script>
</body>
</html>
