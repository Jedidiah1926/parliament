<head>

<style>
  :root {
    --tno-bg: #101218;
    --tno-panel: #1a1d26;
    --tno-neon: #00ffff;
    --tno-neon-dim: color-mix(in srgb, var(--tno-neon) 30%, transparent);
    --tno-text: #e0e0e0;
    --tno-border: #4a5a6a;
    --tno-gold: #ffd700;
  }
  * { box-sizing: border-box; }
  /* 네온: 둥근모는 굵은 글꼴이 없어 브라우저가 가짜 굵게를 만들면 글자가 뭉개진다 — 다른 네온 화면처럼 보통 굵기로 */
  html:not([data-theme-family="modern"]) body, html:not([data-theme-family="modern"]) body * { font-weight: normal; font-synthesis: none; }
  body {
    font-family: 'NeoDunggeunmo', 'VT323', monospace;
    background: var(--tno-bg);
    color: var(--tno-text);
  }
  /* CRT 스캔라인 + 색수차 느낌 오버레이 — 다른 페이지(main.html 등)와 동일한 효과 */
  body::after {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 999;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }
  ::-webkit-scrollbar { width: 10px; height: 12px; background: #000; }
  ::-webkit-scrollbar-thumb { background: var(--tno-border); border: 1px solid var(--tno-neon); box-shadow: inset 0 0 5px color-mix(in srgb, var(--tno-neon) 22%, transparent), 0 0 5px color-mix(in srgb, var(--tno-neon) 18%, transparent); }
  ::-webkit-scrollbar-thumb:hover { background: var(--tno-neon); box-shadow: 0 0 12px var(--tno-neon); }
  ::-webkit-scrollbar-track { background: #000; border-top: 1px solid #1f343c; }
  ::-webkit-scrollbar-corner { background: #000; }

  /* ── 앱 레이아웃: 화면 높이에 맞추고 페이지는 스크롤하지 않음 (목록만 안에서 스크롤) ── */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .mm-app { height: 100vh; display: flex; flex-direction: column; }
  .mm-appbar { flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--tno-border); background: var(--tno-panel); }
  .mm-titles { flex: 1; min-width: 0; }
  .mm-titles .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 { font-size:20px; margin:0 0 2px; color: var(--tno-neon); text-shadow: 0 0 6px var(--tno-neon-dim); letter-spacing: 1px; }
  .mm-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .mm-back { text-decoration: none; flex-shrink: 0; }
  .mm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px 20px; }
  .panel {
    background: var(--tno-panel);
    border: 2px solid var(--tno-border);
    padding:12px;
    box-shadow: 0 0 15px color-mix(in srgb, var(--tno-neon) 8%, transparent);
    min-height: 0;
  }
  .mm-main { display: flex; flex-direction: column; gap: 10px; }
  .mm-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
  .mm-toolbar label { display: inline-flex; align-items: center; gap: 6px; }
  .mm-spacer { flex: 1; }
  #preview { flex: 1; min-height: 0; overflow:hidden; background:#0a0c11; border: 1px solid var(--tno-border); display:flex; align-items:center; justify-content:center; }
  #svgContainer { width: 100%; height: 100%; padding: 8px; display: flex; align-items: center; justify-content: center; text-align: center; color: #8a94a3; }
  #svgContainer svg { width:100%; height:100%; display:block; }
  .mm-empty { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .mm-empty-title { font-size: 16px; }
  .mm-side { display: flex; flex-direction: column; gap: 8px; }
  .mm-side-head { display: flex; justify-content: space-between; align-items: center; }
  .mm-side-title { font-weight: 700; color: var(--tno-neon); }
  .mm-side .list { flex: 1; min-height: 0; overflow: auto; margin-top: 0; }
  .mm-side-foot { display: flex; flex-direction: column; gap: 6px; }
  .mm-row { display: flex; gap: 6px; }
  .mm-row .btn { flex: 1; }
  /* 좁은 화면: 목록을 아래로 */
  @media (max-width: 860px) {
    .mm-appbar { flex-wrap: wrap; }
    .mm-titles .small { white-space: normal; }
    .mm-body { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
  }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .controls label { color: var(--tno-text); font-size: 14px; }
  .mm-viewbar { display: flex; align-items: center; gap: 10px; }
  #preview.panning { cursor: grabbing; }
  /* 목록에 마우스를 올린 도형 / 지도에서 마우스를 올린 도형의 목록 줄 — 서로 연결해 어느 것인지 바로 보이게 */
  /* 도형 상태 4가지: 기본 / 호버(굵은 강조 테두리 + 살짝 밝게) / 선택(강조색으로 칠함) / 선택+호버(강조색 + 굵은 테두리) */
  #svgContainer { --mm-accent: var(--tno-neon); }
  #svgContainer svg .mm-sel { fill: color-mix(in srgb, var(--mm-accent) 45%, #1a1d26) !important; fill-opacity: 1 !important; }
  #svgContainer svg .mm-hl { stroke: var(--mm-accent) !important; stroke-width: 3px !important; vector-effect: non-scaling-stroke; filter: brightness(1.2); }
  .item.hl { background: color-mix(in srgb, var(--tno-neon) 10%, transparent); }
  .mm-kind { font-size: 12px; padding: 1px 7px; border: 1px solid var(--tno-border); color: #8a94a3; white-space: nowrap; }
  .mm-kind.kind-area { color: var(--tno-neon); border-color: color-mix(in srgb, var(--tno-neon) 50%, transparent); }
  .mm-kind.kind-line { color: var(--tno-gold); border-color: color-mix(in srgb, var(--tno-gold) 50%, transparent); }
  .item { display:flex; gap:6px; flex-wrap:wrap; row-gap:6px; align-items:center; padding:6px; border-bottom:1px solid var(--tno-border); }
  .item button { margin-left:auto; }
  .item .mm-cut { color: var(--tno-gold); border-color: var(--tno-gold); }
  .item .mm-cut + .btn { margin-left: 0; }
  input[type="text"] {
    width:100px; padding:5px 8px; background:#000; border:1px solid var(--tno-border);
    color: var(--tno-text); font-family: inherit;
  }
  input[type="text"]:focus { outline:none; border-color: var(--tno-neon); box-shadow: 0 0 6px var(--tno-neon-dim); }

  /* 파일 업로드 칸: 브라우저 기본 버튼 대신 테마에 맞춘 커스텀 버튼 + 파일명 표시 */
  input[type="file"] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .file-label {
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  }
  #fileNameDisplay { color:#8a94a3; font-size:13px; }

  /* 체크박스: 테마에 맞춘 커스텀 스타일 */
  input[type="checkbox"] {
    appearance:none; -webkit-appearance:none; width:16px; height:16px; flex-shrink:0;
    background:#000; border:1px solid var(--tno-border);
    cursor:pointer; position:relative; margin:0;
  }
  input[type="checkbox"]:hover { border-color: var(--tno-neon); }
  input[type="checkbox"]:checked { background: var(--tno-neon); border-color: var(--tno-neon); box-shadow: 0 0 6px var(--tno-neon-dim); }
  input[type="checkbox"]:checked::after {
    content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid #000; border-width:0 2px 2px 0; transform: rotate(45deg);
  }

  .small { font-size:13px; color:#8a94a3; }
  .btn {
    background: var(--tno-neon); color:#000; padding:8px 10px;
    border:none; cursor:pointer; font-family: inherit; font-weight: bold; white-space: nowrap;
  }
  .btn:hover { background:#fff; box-shadow: 0 0 15px var(--tno-neon); }
  .btn.secondary {
    background: transparent; color: var(--tno-neon); border:1px solid var(--tno-neon);
  }
  .btn.secondary:hover { background: var(--tno-neon-dim); box-shadow: 0 0 10px var(--tno-neon-dim); }
  .btn.icon { padding:6px 9px; font-size:15px; line-height:1; }
  #count { color: var(--tno-gold); }
</style>

<body>
  <!-- 맵 메이커: 화면 크기에 맞춘 앱 레이아웃 (위: 앱 바 · 가운데: 미리보기 · 오른쪽: 요소 목록) — 페이지 스크롤 없음 -->
  <div class="mm-app">
    <header class="mm-appbar">
      <a href="index.html" class="btn secondary mm-back" title="메인 화면으로">← 메인으로</a>
      <div class="mm-titles">
        <h1>맵 메이커</h1>
        <div class="small">SVG 지도를 지역구 지도 파일(.jsx)로 — 만든 파일은 여론 › 지역구에서 불러옵니다</div>
      </div>
      <div class="mm-actions">
        <input id="fileInput" type="file" accept=".svg,image/svg+xml" />
        <label for="fileInput" class="btn secondary file-label">⬆ SVG 열기</label>
        <button id="btnExportAll" class="btn">내보내기</button>
      </div>
    </header>

    <div class="mm-body">
      <main class="panel mm-main">
        <div class="mm-toolbar">
          <span id="fileNameDisplay">파일 없음</span>
          <span class="mm-spacer"></span>
          <label><input id="toggleIds" type="checkbox" checked /> id/label 우선 사용</label>
          <label><input id="wrapSvg" type="checkbox" checked /> 내보낼 때 <code>&lt;svg viewBox&gt;</code> 래퍼 포함</label>
          <button id="btnClear" class="btn secondary">초기화</button>
        </div>
        <div class="mm-viewbar">
          <span class="small">스크롤: 확대 · 축소 &nbsp;·&nbsp; 휠 클릭 드래그: 이동 &nbsp;·&nbsp; 클릭: 선택</span>
          <span class="mm-spacer"></span>
          <button id="btnResetView" class="btn secondary">↺ 위치 초기화</button>
        </div>
        <div id="preview">
          <div id="svgContainer">
            <div class="mm-empty">
              <div class="mm-empty-title">업로드한 SVG가 여기 표시됩니다</div>
              <div class="small">① ⬆ SVG 열기(바로 분석) → ② 오른쪽 목록에서 이름 고치기 · 고르기 → ③ 내보내기</div>
              <div class="small">떨어진 땅 여러 곳이 도형 하나로 묶여 있으면 목록의 ✂로 나누고, 같은 지역구는 골라서 합치세요</div>
            </div>
          </div>
        </div>
      </main>

      <aside class="panel mm-side">
        <div class="mm-side-head">
          <div class="mm-side-title">요소 목록</div>
          <div class="small">찾은 도형 <span id="count">0</span></div>
        </div>
        <div class="list" id="elementsList"></div>
        <div class="mm-side-foot">
          <div class="mm-row">
            <button id="btnSelectAll" class="btn secondary">모두 선택</button>
            <button id="btnDeselectAll" class="btn secondary">선택 해제</button>
          </div>
          <div class="mm-row">
            <button id="btnMergeSelected" class="btn secondary" title="고른 도형들을 지역구 하나로 합칩니다">선택한 도형 합치기</button>
          </div>
          <div class="mm-row">
            <button id="btnExportSelected" class="btn secondary">선택한 것만 내보내기</button>
            <button id="btnDownloadSVG" class="btn secondary">수정된 SVG 다운로드</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

<script>
/* SVG Splitter — client-side */
let lastSVGText = "";
let svgDoc = null;
let shapes = []; // {el, tag, id, defaultId, selected}

const fileInput = document.getElementById('fileInput');
const svgContainer = document.getElementById('svgContainer');
const elementsList = document.getElementById('elementsList');
const countEl = document.getElementById('count');
const btnExportAll = document.getElementById('btnExportAll');
const btnExportSelected = document.getElementById('btnExportSelected');
const btnSelectAll = document.getElementById('btnSelectAll');
const btnDeselectAll = document.getElementById('btnDeselectAll');
const btnDownloadSVG = document.getElementById('btnDownloadSVG');
const btnClear = document.getElementById('btnClear');
const fileNameDisplay = document.getElementById('fileNameDisplay');

// 파일을 열면 바로 분석 (따로 누르는 분석 버튼 없음)
fileInput.addEventListener('change', () => {
  fileNameDisplay.textContent = fileInput.files?.[0]?.name || '파일 없음';
  if (fileInput.files && fileInput.files.length) parseUploaded();
});

function readFileAsText(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsText(file, 'utf-8');
  });
}

function sanitizeId(s, fallback) {
  if(!s) return fallback;
  return s.replace(/[^\w\-]/g, '_');
}

async function parseUploaded() {
  elementsList.innerHTML = '';
  shapes = [];
  if (!fileInput.files || fileInput.files.length === 0) return alert('SVG 파일을 선택하세요.');
  const text = await readFileAsText(fileInput.files[0]);
  lastSVGText = text;
  // parse to DOM
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');
  svgDoc = doc;
  const svg = doc.querySelector('svg');
  if (!svg) return alert('유효한 SVG가 아닙니다.');
  // render inline copy (clone) to container
  svgContainer.innerHTML = '';
  const clone = svg.cloneNode(true);
  // make sure it scales to container
  clone.style.width = '100%';
  clone.style.height = '100%'; // 미리보기 영역 안에 지도 전체가 들어가게 (비율 유지)
  svgContainer.appendChild(clone);

  // gather shapes
  const nodeList = clone.querySelectorAll('path,polygon,polyline,rect,circle,ellipse');
  nodeList.forEach((el, idx) => {
    const tag = el.tagName.toLowerCase();
    const origId = el.id || el.getAttribute('inkscape:label') || el.getAttribute('data-name') || '';
    const defaultId = origId || `${tag}_${idx+1}`;
    const safe = sanitizeId(defaultId, `${tag}_${idx+1}`);
    // rawName: 한글 등 원문 그대로 (표시/내보내기용). id는 항상 영문 JS 식별자로 써야 해서 sanitize된 값을 씀
    shapes.push({ el, tag, kind: shapeKind(el, tag), id: safe, defaultId: safe, rawName: origId || safe, selected: false, origId });
  });

  renderList();
  attachHoverHandlers();
  initPanZoom(clone);
}

// 도형 종류: 선(채우기 없는 path · polyline · line) / 면(채운 path · polygon) / 사각형(rect) / 원(circle · ellipse)
// 지역구로 쓰는 건 보통 "면" — 선은 경계선 등 장식이라 대개 내보낼 필요가 없다
function shapeKind(el, tag) {
  if (tag === 'rect') return 'rect';
  if (tag === 'circle' || tag === 'ellipse') return 'circle';
  if (tag === 'polyline' || tag === 'line') return 'line';
  const fillAttr = (el.getAttribute('fill') || '').trim().toLowerCase();
  let fill = fillAttr;
  if (!fill) { try { fill = (getComputedStyle(el).fill || '').toLowerCase(); } catch (e) { fill = ''; } }
  return (fill === 'none' || fill === 'transparent') ? 'line' : 'area';
}
const KIND_LABEL = { area: '면', line: '선', rect: '사각형', circle: '원' };

function setHighlight(s, on) {
  s.el.classList.toggle('mm-hl', on);
  const row = elementsList.children[shapes.indexOf(s)];
  if (row) row.classList.toggle('hl', on);
  return row;
}
function setSelected(s, on) {
  s.selected = on;
  s.el.classList.toggle('mm-sel', on);
  const row = elementsList.children[shapes.indexOf(s)];
  const cb = row && row.querySelector('input[type="checkbox"]');
  if (cb) cb.checked = on;
}

// ===== 미리보기 확대 · 이동 — 스크롤: 확대/축소(마우스 위치 기준), 휠 클릭 드래그: 이동, ↺: 처음 보기로 =====
let view = null; // { svg, base:{x,y,w,h}, cur:{x,y,w,h} }
function readViewBox(svg) {
  const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  if (vb.length === 4 && vb.every(n => !isNaN(n)) && vb[2] > 0 && vb[3] > 0) return { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
  const w = parseFloat(svg.getAttribute('width')) || 0, h = parseFloat(svg.getAttribute('height')) || 0;
  if (w > 0 && h > 0) return { x: 0, y: 0, w, h };
  try { const b = svg.getBBox(); if (b.width > 0 && b.height > 0) return { x: b.x, y: b.y, w: b.width, h: b.height }; } catch (e) {}
  return { x: 0, y: 0, w: 100, h: 100 };
}
function applyView() { const c = view.cur; view.svg.setAttribute('viewBox', `${c.x} ${c.y} ${c.w} ${c.h}`); }
function initPanZoom(svg) {
  const base = readViewBox(svg);
  view = { svg, base, cur: { ...base } };
  applyView();
}
function resetView() { if (!view) return; view.cur = { ...view.base }; applyView(); }
function svgPoint(clientX, clientY) {
  const m = view.svg.getScreenCTM();
  if (!m) return null;
  const pt = view.svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(m.inverse());
}
(function setupPreviewNav() {
  const preview = document.getElementById('preview');
  let panning = false, lastX = 0, lastY = 0;
  preview.addEventListener('wheel', e => {
    if (!view) return;
    e.preventDefault(); // 이 캔버스 안에서는 스크롤 = 확대/축소 (shift 없이도)
    const p = svgPoint(e.clientX, e.clientY); if (!p) return;
    const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const c = view.cur;
    const w = Math.min(view.base.w * 4, Math.max(view.base.w / 40, c.w / f));
    const k = w / c.w;
    view.cur = { x: p.x - (p.x - c.x) * k, y: p.y - (p.y - c.y) * k, w, h: c.h * k };
    applyView();
  }, { passive: false });
  preview.addEventListener('mousedown', e => {
    if (e.button !== 1 || !view) return; // 휠 클릭 드래그로 이동
    panning = true; lastX = e.clientX; lastY = e.clientY;
    preview.classList.add('panning');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!panning) return;
    const m = view.svg.getScreenCTM(); if (!m) return;
    view.cur.x -= (e.clientX - lastX) / m.a;
    view.cur.y -= (e.clientY - lastY) / m.d;
    lastX = e.clientX; lastY = e.clientY;
    applyView();
  });
  window.addEventListener('mouseup', () => { if (panning) { panning = false; preview.classList.remove('panning'); } });
  preview.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); }); // 휠 클릭 자동 스크롤 막기
})();

function renderList() {
  elementsList.innerHTML = '';
  shapes.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    // color swatch (computed)
    const sw = document.createElement('div');
    sw.style.width = '12px'; sw.style.height='12px'; sw.style.border='1px solid var(--tno-border)';
    const fill = s.el.getAttribute('fill') || window.getComputedStyle(s.el).fill || '#ccc';
    sw.style.background = fill;
    div.appendChild(sw);
    // name input
    const input = document.createElement('input');
    input.type = 'text';
    input.value = s.rawName || s.id; // 한글 이름도 원문 그대로 (컴포넌트 이름용 영문 식별자는 내보낼 때 따로 만든다)
    input.title = s.origId || '';
    input.oninput = (e) => {
      s.rawName = e.target.value || s.defaultId; // 표시/내보내기용 원문(한글 등 포함)
      s.id = sanitizeId(e.target.value || s.defaultId, s.defaultId); // JS 컴포넌트 이름용 영문 식별자
    };
    div.appendChild(input);
    // 종류: 선 / 면 / 사각형 / 원 (원래 SVG 태그는 마우스를 올리면)
    const kindSpan = document.createElement('span');
    kindSpan.className = 'mm-kind kind-' + s.kind;
    kindSpan.textContent = KIND_LABEL[s.kind] || s.tag;
    kindSpan.title = `<${s.tag}>`;
    div.appendChild(kindSpan);
    // select checkbox
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.style.marginLeft = '8px';
    chk.title = '선택';
    chk.onchange = (ev) => setSelected(s, ev.target.checked);
    div.appendChild(chk);
    // 목록 줄에 마우스를 올리면 지도에서 그 도형을 강조
    div.onmouseenter = () => setHighlight(s, true);
    div.onmouseleave = () => setHighlight(s, false);
    // 떨어진 땅이 여러 곳 묶인 도형이면 나누기 버튼
    const parts = shapePieces(s);
    if (parts) {
      const cut = document.createElement('button');
      cut.textContent = `✂ ${parts.length}`;
      cut.title = `떨어진 땅 ${parts.length}곳이 도형 하나로 묶여 있습니다 — 눌러서 따로따로 나누기`;
      cut.className = 'btn secondary icon mm-cut';
      cut.onclick = () => splitShape(s);
      div.appendChild(cut);
    }
    // export single button
    const btn2 = document.createElement('button');
    btn2.textContent = '⇩';
    btn2.title = '내보내기';
    btn2.className = 'btn icon';
    btn2.onclick = () => downloadComponents([s], true);
    div.appendChild(btn2);
    elementsList.appendChild(div);
  });
  countEl.textContent = shapes.length;
}

// 지도에서 도형에 마우스를 올리면 목록의 그 줄을 강조하고 보이게 스크롤, 클릭하면 선택/해제
function attachHoverHandlers() {
  shapes.forEach(s => {
    s.el.style.cursor = 'pointer';
    s.el.onmouseenter = () => { const row = setHighlight(s, true); if (row) row.scrollIntoView({ block: 'nearest' }); };
    s.el.onmouseleave = () => setHighlight(s, false);
    s.el.onclick = () => setSelected(s, !s.selected);
  });
}

// ===== 떨어진 땅 나누기 · 도형 합치기 =====
// 지도를 만든 사람이 서로 떨어진 땅(예: 다른 주 두세 곳)을 <path> 하나에 묶어 두면 게임에서 지역구 하나로 잡혀 쓰기 어렵다.
// path를 하위 경로로 쪼갠 뒤, 구멍(다른 조각 안쪽)은 바깥 조각에, 바로 옆 작은 섬은 가까운 땅에 붙여 "떨어진 땅" 단위로 나눈다
function parsePathData(d) {
  const segs = [];
  const str = String(d || '');
  let i = 0, cmd = null;
  const ARGC = { m: 2, l: 2, h: 1, v: 1, c: 6, s: 4, q: 4, t: 2, a: 7, z: 0 };
  const skip = () => { while (i < str.length && /[\s,]/.test(str[i])) i++; };
  const num = flag => {
    skip();
    if (flag && (str[i] === '0' || str[i] === '1')) return Number(str[i++]); // 호(a)의 플래그는 붙여 쓸 수 있음
    const m = /^[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/.exec(str.slice(i, i + 40));
    if (!m) return null;
    i += m[0].length;
    return Number(m[0]);
  };
  for (;;) {
    skip();
    if (i >= str.length) break;
    if (/[a-zA-Z]/.test(str[i])) cmd = str[i++];
    else if (!cmd) return null;
    const lc = cmd.toLowerCase();
    if (!(lc in ARGC)) return null;
    if (lc === 'z') { segs.push({ cmd, args: [] }); cmd = null; continue; }
    const args = [];
    for (let k = 0; k < ARGC[lc]; k++) {
      const v = num(lc === 'a' && (k === 3 || k === 4));
      if (v == null || Number.isNaN(v)) return null;
      args.push(v);
    }
    segs.push({ cmd, args });
    if (cmd === 'm') cmd = 'l'; else if (cmd === 'M') cmd = 'L'; // M 뒤에 이어지는 좌표는 선긋기
  }
  return segs;
}
// 하위 경로마다 따로 떼어 쓸 수 있는 d — 각 하위 경로의 첫 이동(m)을 절대 좌표(M)로 바꿔 둔다
function splitSubpaths(d) {
  const segs = parsePathData(d);
  if (!segs || !segs.length) return null;
  const subs = [];
  let cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
  segs.forEach(({ cmd, args }) => {
    const rel = cmd === cmd.toLowerCase();
    const lc = cmd.toLowerCase();
    if (lc === 'm') {
      cx = rel ? cx + args[0] : args[0];
      cy = rel ? cy + args[1] : args[1];
      sx = cx; sy = cy;
      cur = [`M${cx} ${cy}`];
      subs.push(cur);
      return;
    }
    if (!cur) { cur = [`M${cx} ${cy}`]; subs.push(cur); }
    cur.push(cmd + args.join(' '));
    if (lc === 'z') { cx = sx; cy = sy; return; }
    if (lc === 'h') { cx = rel ? cx + args[0] : args[0]; return; }
    if (lc === 'v') { cy = rel ? cy + args[0] : args[0]; return; }
    const n = args.length;
    cx = rel ? cx + args[n - 2] : args[n - 2];
    cy = rel ? cy + args[n - 1] : args[n - 1];
  });
  return subs.map(p => p.join(''));
}
// 도형의 "떨어진 땅" 목록 [d, ...] (큰 것부터) — 한 덩어리뿐이면 null
function shapePieces(s) {
  if (!s || s.tag !== 'path' || !s.el.isConnected) return null;
  const d = s.el.getAttribute('d') || '';
  if (s._piecesFor === d) return s._pieces;
  s._piecesFor = d;
  s._pieces = null;
  const subs = splitSubpaths(d);
  if (!subs || subs.length < 2) return null;
  // 같은 부모 안에 임시로 그려 크기를 잰다 (같은 좌표계)
  const parent = s.el.parentNode;
  const els = subs.map(sd => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', sd);
    p.setAttribute('visibility', 'hidden');
    parent.appendChild(p);
    return p;
  });
  const info = els.map((el, idx) => {
    let bb = { x: 0, y: 0, width: 0, height: 0 }, start = null;
    try { bb = el.getBBox(); } catch (e) {}
    try { const pt = el.getPointAtLength(0); start = { x: pt.x, y: pt.y }; } catch (e) {}
    return { idx, bb, area: bb.width * bb.height, start };
  });
  const up = info.map((a, k) => k);
  const find = k => { while (up[k] !== k) { up[k] = up[up[k]]; k = up[k]; } return k; };
  const join = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) up[ra] = rb; };
  const contains = (o, a) => a.bb.x >= o.bb.x && a.bb.y >= o.bb.y && a.bb.x + a.bb.width <= o.bb.x + o.bb.width && a.bb.y + a.bb.height <= o.bb.y + o.bb.height;
  // 구멍: 시작점이 더 큰 다른 조각 안(채움 영역)에 있으면 그 조각에 딸린 것
  info.forEach(a => {
    if (!a.start) return;
    const svgEl = s.el.ownerSVGElement;
    for (const b of info) {
      if (b === a || b.area <= a.area || !contains(b, a)) continue;
      let inside = false;
      try { const pt = svgEl.createSVGPoint(); pt.x = a.start.x; pt.y = a.start.y; inside = els[b.idx].isPointInFill(pt); } catch (e) {}
      if (inside) { join(a.idx, b.idx); break; }
    }
  });
  // 가까운 작은 땅(본토 옆 작은 섬 등)은 옆 땅과 한 덩어리로 — 도형 전체 크기의 3% 안쪽으로 붙어 있으면.
  // 큰 땅끼리는 붙이지 않는다: 큰 땅 두 곳은 테두리 상자(가로 · 세로 범위)가 겹치기만 해도 붙어 버려서
  // 실제로는 떨어진 두 주(예: 위아래로 어긋난 두 지역)가 한 덩어리로 잡혔다
  const x0 = Math.min(...info.map(a => a.bb.x)), y0 = Math.min(...info.map(a => a.bb.y));
  const x1 = Math.max(...info.map(a => a.bb.x + a.bb.width)), y1 = Math.max(...info.map(a => a.bb.y + a.bb.height));
  const gap = Math.max(x1 - x0, y1 - y0) * 0.03;
  const biggest = Math.max(...info.map(a => a.area));
  const small = a => a.area < biggest * 0.05;
  info.forEach(a => info.forEach(b => {
    if (b.idx <= a.idx) return;
    if (!small(a) && !small(b) && Math.min(a.area, b.area) >= Math.max(a.area, b.area) * 0.05) return;
    if (a.bb.x - gap <= b.bb.x + b.bb.width && b.bb.x - gap <= a.bb.x + a.bb.width
      && a.bb.y - gap <= b.bb.y + b.bb.height && b.bb.y - gap <= a.bb.y + a.bb.height) join(a.idx, b.idx);
  }));
  els.forEach(el => el.remove());
  const groups = new Map();
  info.forEach(a => { const r = find(a.idx); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(a.idx); });
  if (groups.size < 2) return null;
  s._pieces = [...groups.values()]
    .map(idxs => ({ d: idxs.sort((x, y) => x - y).map(k => subs[k]).join(''), area: idxs.reduce((t, k) => t + info[k].area, 0) }))
    .sort((a, b) => b.area - a.area)
    .map(p => p.d);
  return s._pieces;
}
function newShapeEntry(el, base, name) {
  const safe = sanitizeId(name, base.defaultId);
  return { el, tag: el.tagName.toLowerCase(), kind: base.kind, id: safe, defaultId: safe, rawName: name, selected: false, origId: name };
}
// 도형 하나를 떨어진 땅마다 따로 — 가장 큰 땅은 원래 이름, 나머지는 "이름_2", "이름_3" …
function splitShape(s) {
  const parts = shapePieces(s);
  if (!parts) return;
  const at = shapes.indexOf(s);
  const baseName = s.rawName || s.id;
  const used = new Set(shapes.map(x => x.rawName));
  const added = [];
  s.el.setAttribute('d', parts[0]);
  let anchor = s.el;
  parts.slice(1).forEach((d, i) => {
    const el = s.el.cloneNode(false);
    el.removeAttribute('id');
    el.classList.remove('mm-hl', 'mm-sel');
    el.setAttribute('d', d);
    anchor.after(el);
    anchor = el;
    let n = i + 2, name;
    do { name = `${baseName}_${n++}`; } while (used.has(name));
    used.add(name);
    added.push(newShapeEntry(el, s, name));
  });
  s._piecesFor = null;
  shapes.splice(at + 1, 0, ...added);
  setSelected(s, false);
  renderList();
  attachHoverHandlers();
  const row = elementsList.children[at];
  if (row) row.scrollIntoView({ block: 'nearest' });
}
// 고른 도형들을 하나로 (같은 지역구인데 따로 그려진 땅 · 나눈 뒤 다시 묶을 땅) — 첫 번째 도형 이름을 쓴다
function polyToPathD(el) {
  const pts = (el.getAttribute('points') || '').trim();
  if (!pts) return '';
  return 'M' + pts + (el.tagName.toLowerCase() === 'polygon' ? 'Z' : '');
}
function mergeSelected() {
  const list = getSelectedShapes();
  if (list.length < 2) return alert('합칠 도형을 두 개 이상 고르세요.');
  if (list.some(x => !['path', 'polygon'].includes(x.tag))) return alert('면(path · polygon)끼리만 합칠 수 있습니다.');
  const frame = x => {
    const chain = [];
    for (let node = x.el; node && node.tagName && node.tagName.toLowerCase() !== 'svg'; node = node.parentElement) {
      const t = node.getAttribute && node.getAttribute('transform');
      if (t && t.trim()) chain.unshift(t.trim());
    }
    return chain.join(' ');
  };
  const f0 = frame(list[0]);
  if (list.some(x => frame(x) !== f0)) return alert('좌표 변환(transform)이 서로 다른 도형은 합칠 수 없습니다.');
  const first = list[0];
  const d = list.map(x => x.tag === 'path' ? (x.el.getAttribute('d') || '') : polyToPathD(x.el)).join(' ');
  let target = first.el;
  if (first.tag !== 'path') {
    target = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    Array.from(first.el.attributes).forEach(a => { if (a.name !== 'points') target.setAttribute(a.name, a.value); });
    first.el.replaceWith(target);
    first.el = target;
    first.tag = 'path';
  }
  target.setAttribute('d', d);
  list.slice(1).forEach(x => x.el.remove());
  shapes = shapes.filter(x => !list.slice(1).includes(x));
  first._piecesFor = null;
  shapes.forEach(x => setSelected(x, false));
  renderList();
  attachHoverHandlers();
}

/* Export logic: create a .jsx text with React components */
function toJSXName(name) {
  // CamelCase
  return name.replace(/^[^A-Za-z]+/, '').split(/[_\- ]+/).map((p,i)=> i? (p.charAt(0).toUpperCase()+p.slice(1)) : (p.charAt(0).toUpperCase()+p.slice(1))).join('') || 'Path';
}
function escapeAttr(s) {
  // escape backticks and closing braces used in template; we'll wrap strings in double quotes
  if (!s) return '';
  return s.replace(/"/g, '&quot;').replace(/`/g,'\\`');
}

function download(filename, text) {
  const a = document.createElement('a');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
}

function generateComponentText(items, includeSvgWrapper = true) {
  const rootSvg = svgDoc ? svgDoc.querySelector('svg') : null;
  const viewBox = rootSvg ? (rootSvg.getAttribute('viewBox') || `0 0 ${rootSvg.getAttribute('width')||100} ${rootSvg.getAttribute('height')||100}`) : '0 0 100 100';
  let out = `import React from 'react';\n\n// Auto-generated by SVG Splitter\n// VIEWBOX: ${viewBox}\n\n`;

  // 한글 등 라틴 문자가 아닌 이름은 toJSXName()이 빈 문자열로 지워버려 여러 도형이 전부
  // 같은 컴포넌트 이름(예: 'Path')으로 겹치는 문제가 있었음 — 겹치면 번호를 붙여 구분
  const usedNames = new Set();
  const names = items.map((it, idx) => {
    let n = toJSXName(it.id) || `Shape${idx+1}`;
    while (usedNames.has(n)) n = `${n}_${idx+1}`;
    usedNames.add(n);
    return n;
  });

  items.forEach((it, idx) => {
    const name = names[idx];
    const tag = it.tag;
    let attrText = '';
    // pick attributes to include
    const attrs = it.el.attributes;
    const keep = [];
    for (let j=0;j<attrs.length;j++) {
      const a = attrs[j];
      const aname = a.name;
      if (aname === 'd' || aname === 'points' || aname === 'cx' || aname === 'cy' || aname === 'r' ||
          aname==='x' || aname==='y' || aname==='width' || aname==='height' || aname==='rx' || aname==='ry' || aname==='fill' || aname==='stroke' || aname==='transform') {
        keep.push([aname, a.value]);
      }
    }
    // 바깥 그룹(<g transform=...>)의 변환도 함께 — 도형 자기 transform만 담으면 그룹에 걸린 뒤집기 · 회전 · 이동이
    // 빠져서 게임에 올렸을 때 지도가 뒤집히거나 돌아가 보였음. SVG transform 목록은 바깥 → 안쪽 순서로 이어 붙이면 된다
    const chain = [];
    for (let node = it.el.parentElement; node && node.tagName && node.tagName.toLowerCase() !== 'svg'; node = node.parentElement) {
      const t = node.getAttribute && node.getAttribute('transform');
      if (t && t.trim()) chain.unshift(t.trim());
    }
    const ownIdx = keep.findIndex(([k]) => k === 'transform');
    if (chain.length) {
      if (ownIdx >= 0) keep[ownIdx][1] = chain.join(' ') + ' ' + keep[ownIdx][1];
      else keep.push(['transform', chain.join(' ')]);
    }
    // build attribute string, but use placeholders for fill/stroke so props override
    keep.forEach(([k,v])=>{
      if (k==='fill') return;
      if (k==='stroke') return;
      if (k==='d' || k==='points') {
        attrText += ` ${k}="${escapeAttr(v)}"`;
      } else {
        attrText += ` ${k}="${v}"`;
      }
    });
    // data-key: 컴포넌트 이름은 JS 식별자라야 해서 한글 등은 못 담지만, 실제 지역구 이름(한글 포함)은
    // 이 속성에 원문 그대로 보존해 가져오는 쪽에서 표시 이름으로 쓸 수 있게 함
    const rawKey = it.rawName || it.id || name;
    attrText += ` data-key="${escapeAttr(rawKey)}"`;
    // component template
    out += `export const ${name} = ({ fill = 'currentColor', stroke = 'none', onClick, className, style }) => (\n  <${tag} ${attrText} fill={fill} stroke={stroke} onClick={onClick} className={"{className}"} style={"{style}"} />\n);\n\n`;
  });
  // default export map
  out += `const COMPONENTS = {\n`;
  items.forEach((it, idx) => {
    out += `  '${names[idx]}': ${names[idx]},\n`;
  });
  out += `};\n\nexport default COMPONENTS;\n`;
  // note: above we inserted placeholders for className/style strings because building correct JSX with string templates in-browser is messy;
  // We'll post-process replace the placeholder "{className}" -> {className} and "{style}" -> {style}
  out = out.replace(/className="\{className\}"/g, 'className={className}');
  out = out.replace(/style="\{style\}"/g, 'style={style}');
  return out;
}

function getSelectedShapes() {
  return shapes.filter(s => s.selected);
}

function downloadComponents(list, singleFile = true) {
  if (!list || list.length === 0) {
    alert('선택된 요소가 없습니다.');
    return;
  }
  const jsx = generateComponentText(list, document.getElementById('wrapSvg').checked);
  const filename = 'svg_components.jsx';
  download(filename, jsx);
}

// "id/label 우선 사용"을 바꾸면 열린 파일을 다시 분석해 이름 규칙을 바로 반영
document.getElementById('toggleIds')?.addEventListener('change', () => { if (fileInput.files && fileInput.files.length) parseUploaded(); });
btnExportAll.addEventListener('click', ()=> downloadComponents(shapes, true));
btnExportSelected.addEventListener('click', ()=> downloadComponents(getSelectedShapes(), true));
btnSelectAll.addEventListener('click', ()=> shapes.forEach(s => setSelected(s, true)));
btnDeselectAll.addEventListener('click', ()=> shapes.forEach(s => setSelected(s, false)));
document.getElementById('btnResetView').addEventListener('click', resetView);
document.getElementById('btnMergeSelected').addEventListener('click', mergeSelected);
btnDownloadSVG.addEventListener('click', ()=> {
  // 나누기 · 합치기 · 이름 고치기를 반영한 지금 지도를 SVG로 (화면 확대 상태와 강조 표시는 빼고)
  if (!lastSVGText || !view) return alert('먼저 SVG를 여세요.');
  const out = view.svg.cloneNode(true);
  const b = view.base;
  out.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`);
  out.style.removeProperty('width'); out.style.removeProperty('height');
  if (!out.getAttribute('style')) out.removeAttribute('style');
  const live = Array.from(view.svg.querySelectorAll('path,polygon,polyline,rect,circle,ellipse'));
  const copies = Array.from(out.querySelectorAll('path,polygon,polyline,rect,circle,ellipse'));
  copies.forEach((el, i) => {
    el.classList.remove('mm-hl', 'mm-sel');
    if (!el.getAttribute('class')) el.removeAttribute('class');
    el.style.removeProperty('cursor');
    if (!el.getAttribute('style')) el.removeAttribute('style');
    const s = shapes.find(x => x.el === live[i]);
    if (s && s.rawName) el.setAttribute('id', s.rawName);
  });
  download('edited.svg', new XMLSerializer().serializeToString(out));
});
btnClear.addEventListener('click', ()=> {
  fileInput.value = '';
  fileNameDisplay.textContent = '파일 없음';
  svgContainer.innerHTML = '<div class="mm-empty"><div class="mm-empty-title">업로드한 SVG가 여기 표시됩니다</div></div>';
  elementsList.innerHTML = '';
  shapes = [];
  svgDoc = null;
  view = null;
  lastSVGText = '';
  countEl.textContent = '0';
});

</script>
</body>
</html>
